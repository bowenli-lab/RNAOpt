# Training configuration
seed: 42
max_len: 4096
learning_rate: 1e-4
batch_size: 4
accumulate_grad_batches: 32
warmup_steps: 1000
total_steps: 10000000
weight_decay: 0.01
mask_prob: 0.15
log_every_n_steps: 1
accelerator: gpu
devices: 2
strategy: ddp_find_unused_parameters_true
val_check_interval: 1000
warmup_start_factor: 0.1

# Model configuration
JambaConfig:
  vocab_size: 9
  tie_word_embeddings: False
  hidden_size: 384
  intermediate_size: 24
  num_hidden_layers: 12
  num_attention_heads: 16
  num_key_value_heads: 16
  pad_token_id: 3
  bos_token_id: 0
  eos_token_id: 1
  num_experts: 8
  expert_layer_period: 2
  expert_layer_offset: 1
  attn_layer_period: 8
  attn_layer_offset: 4
  use_mamba_kernels: True
  mamba_d_state: 16
  mamba_d_conv: 4
  mamba_expand: 2
  mamba_dt_rank: auto

# Data path and output directories
train_file: /home/reagan/Projects/RNA_optimization/model/model_with_UTR/pretrain_data/processed_downloaded_data/ranopt_ncbi_mRNA_mammals_UTR_CDS_merged_deduplicated_ATCG_only_train.hdf5
val_file: /home/reagan/Projects/RNA_optimization/model/model_with_UTR/pretrain_data/processed_downloaded_data/ranopt_ncbi_mRNA_mammals_UTR_CDS_merged_deduplicated_ATCG_only_val.hdf5
test_file: /home/reagan/Projects/RNA_optimization/model/model_with_UTR/pretrain_data/processed_downloaded_data/ranopt_ncbi_mRNA_mammals_UTR_CDS_merged_deduplicated_ATCG_only_test.hdf5
ckpt_dir: /home/reagan/Projects/RNA_optimization/model/models_put_on_github/test_checkpoint
log_dir: /home/reagan/Projects/RNA_optimization/model/models_put_on_github/test_checkpoint

# Checkpointing configuration
monitor: val_loss
mode: min
save_top_k: -1
save_last: False
every_n_steps: 100
ckpt_filename: "{epoch}_{step}_{train_loss:.10f}_{val_loss:.10f}"

